# Repo-specific tools and tasks only; the org belt arrives globally
# (mise/config.toml in monumental-archive/.github, delivered at the SHA
# the gate stub pins). This repository has neither, deliberately:
#
#   - Every tool the old Taskfile ran — hadolint, trivy, shellcheck,
#     shfmt, actionlint, zizmor, gitleaks, yamllint, taplo, typos,
#     rumdl, editorconfig-checker, reuse — is a belt tool now, so a
#     pin here would be a second version of a tool the belt already
#     resolves and locks.
#   - The image build and its smoke test are the continuous
#     archetype's, not the gate's: they run in the publish path
#     (.github/workflows/continuous.yml) over the bytes that get
#     signed, never over a local twin the gate would throw away.
#
# If a task is ever added here it must carry a shell pin beside it —
# `[task_config] shell = "bash -euo pipefail -c"` — because mise's
# default inline shell is `sh -c -o errexit`, which has neither
# pipefail nor nounset (.github#700).
[settings]
lockfile = true
