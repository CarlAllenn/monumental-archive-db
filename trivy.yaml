---
# Canonical trivy filesystem-scan config — copy-template class (issue #15).
# Max enforcement: all scanners, all severities fail the run. Image scans
# deliberately do NOT use this file — see README (vuln-only, config-free).
exit-code: 1
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

scan:
  # Canonical skips: dependency-internal trees. Their VULNS are still
  # caught via the lockfile the fs scan reads; their license files and
  # vendored CI Dockerfiles are not our findings. Per-repo skips append
  # below these, each with a reason.
  skip-dirs:
    - node_modules
    - "**/node_modules"
    - vendor
  scanners:
    - vuln
    - misconfig
    - secret
    - license

# Approved-license policy: standard permissive/weak-copyleft licenses
# accepted in dependencies. Anything not listed still fails; a repo that
# needs another entry adds it here with a reason, never per-invocation.
license:
  full: true
  ignored:
    - MIT
    - ISC
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - 0BSD
    - Zlib
    - Unlicense
    - CC0-1.0
    - BlueOak-1.0.0
    - MPL-2.0
    # Per-repo (with reason, per the canon): AGPL-3.0 is THIS repository's
    # own license, not a dependency finding — the policy above governs what
    # we pull in, and this repo pulls in nothing.
    - AGPL-3.0
