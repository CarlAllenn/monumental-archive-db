---
# CodeQL static analysis (SAST). Canon: renovate-config
# templates/badges/codeql.yml — keep the shape, adapt only the language
# matrix.
#
# This exists because OpenSSF Scorecard's SAST check detects CodeQL,
# SonarCloud or LGTM and nothing else. The gates this repo already enforces
# — hadolint over the Dockerfile, shellcheck over the scripts, zizmor at
# pedantic over these workflows — score zero there, because Scorecard
# cannot see any of them. That is a limitation of the scanner, not a
# judgement about the lints: CodeQL is additive here, never a replacement
# for ci.yml.
#
# `actions` is the whole matrix because it is the only CodeQL language this
# repository contains. There is no application code — the deliverables are
# a Dockerfile, four workflows and two shell scripts. CodeQL has no
# Dockerfile analysis and shell is not one of its languages, so hadolint
# and shellcheck remain the only things reading those files; what CodeQL
# adds is real analysis of the workflows themselves, which is where this
# repo's actual privilege lives (GHCR pushes, OIDC, cosign signing).
#
# Issue #2 listed SAST as an accepted miss on the reasoning that CodeQL
# cannot analyze Dockerfiles. True, and beside the point: the `actions`
# language makes the check reachable anyway.
#
# Gates pull requests alongside ci.yml, and runs weekly so advisory-driven
# query-pack updates re-scan an unchanged main — the same never-fingerprint
# rationale as scheduled.yml.
name: codeql

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # One hour after scheduled.yml (07:00), two after ci.yml's weekly gate
    # (06:00) and one before publish.yml (09:00), so the runs don't contend
    # and a shared-cause failure is distinguishable by timing.
    - cron: 0 8 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      # Inherited from iiif-server's derivation run (its #106/#108), which
      # read this list off 32 successful analyze jobs rather than predicting
      # it. Two departures from that list, both attributable rather than
      # pruned by inspection — the rule (iiif-server#69) is that an
      # allowlist is re-derived or left alone, never trimmed by reading it:
      #   - static.rust-lang.org is dropped. iiif's own comment attributes
      #     it to rustup resolving on every rust leg; this matrix has no
      #     rust leg, so nothing can resolve it.
      #   - everything else is kept as-is, including uploads.github.com,
      #     which appears only on runs whose SARIF upload takes the
      #     large-payload path (5 of iiif's 16).
      # Confirm against the first live run here before treating it as
      # derived for this repo.
      #
      # The wildcards are GitHub infrastructure families whose host index or
      # region rotates between runs, so a literal entry would be a latent
      # failure rather than a tighter policy:
      #   *.actions.githubusercontent.com — results-receiver, broker, and
      #     run-actions-N-azure-REGION where N rotates per run
      #   *.blob.core.windows.net — productionresultssaNN
      #   *.githubapp.com — the hosted-compute watchdog and orchestrator
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
