---
# Publishes the archive's database image. Two properties this workflow
# exists to guarantee, neither of which a single
# `platforms: linux/amd64,linux/arm64` build can give you:
#
#   1. Every architecture is built on its OWN hardware. No QEMU. Emulation
#      would test the image on the wrong machine.
#   2. Nothing is published until the thing being published has booted and
#      proved its extensions actually load. build-push-action's combined
#      build-and-push has no point at which a testable image exists
#      un-published, so the two are split here.
#
# After the manifest exists, the published bytes are pulled back BY DIGEST
# and proved again before anything is signed — a signature must assert
# something demonstrated of the artifact a stranger will pull, not of a
# local twin (the iiif-server publish invariant). The trivy scan in that
# prove step is report-only: the CVE gate lives in ci.yml on pull requests
# (canon: renovate-config templates/trivy) — a publish, especially the
# weekly remediation rebuild, must not die because a scanner had a bad
# day; blocking the rebuild would preserve MORE exposure, not less.
#
# Deliberately cache-free: a workflow that publishes carries no cache of
# any kind (cache-poisoning posture).
name: publish

"on":
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/db-image-smoke.sh
      - .github/workflows/publish.yml
  schedule:
    # The remediation path for the OS layer, and the reason it is a schedule
    # rather than a consequence of commits: PostGIS's transitive dependencies
    # (libexpat1, libnss3 and the rest of the GDAL stack) are pinned by
    # nothing — nothing CAN pin them — so they resolve fresh from
    # trixie-security on every uncached build. A weekly --no-cache rebuild
    # caps exposure on that whole layer at seven days with every deliberate
    # pin intact. Offset from ci.yml's weekly gate (06:00).
    - cron: 0 9 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

# Queue rather than cancel: a half-published manifest is worse than a slow
# one, and overlap is only reachable via manual dispatch.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/carlallenn/monumental-archive-db

jobs:
  build:
    name: build + smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs run to completion: when one architecture fails, the other's
      # result is the evidence that says whether the cause is arch-specific.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # checkout
      packages: write # push the per-architecture image by digest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # apt is fetched over plain http (port 80) by the PGDG and Debian
          # repositories; release-assets serves the edtf tarballs. Docker Hub
          # serves blobs from BOTH production.cloudflare.docker.com and
          # production.cloudfront.docker.com (route varies by runner; the
          # cloudfront leg appeared 2026-08-04 and blocked the amd64 build).
          # buildkit's network namespace may not be governed by harden-runner —
          # allowlisted anyway rather than relying on that being true.
          allowed-endpoints: >
            api.github.com:443
            apt.postgresql.org:80
            apt.postgresql.org:443
            auth.docker.io:443
            deb.debian.org:80
            deb.debian.org:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Bootstrap buildkit from Google's Docker Hub mirror: the default pull
      # from Hub's CDN dial-by-IP'd past DNS on a hosted runner and was
      # rightly refused by egress block; the mirror is a stable, named
      # endpoint (already trusted as trivy's DB source elsewhere).
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `platforms:` input on purpose — the runner IS the target
      # architecture, so the default native build is the guarantee that no
      # emulation can creep in.
      - name: Build for testing (loaded, not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: monumental-archive-db:candidate
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Smoke-test the candidate
        run: bash scripts/db-image-smoke.sh monumental-archive-db:candidate

      # Same builder, same inputs: this resolves from the in-job build above
      # rather than rebuilding, so the published bytes are the tested bytes.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          echo "${DIGEST}" > "digests/${ARCH}"

      - name: Publish the digest for the manifest job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1

  manifest:
    name: manifest + prove + sign
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # create the manifest list
      id-token: write # cosign keyless (Sigstore OIDC)
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # fulcio/rekor/timestamp/tuf: cosign keyless (v3 bundles are
          # RFC3161-timestamped). mirror.gcr.io: trivy's DB for
          # the report-only scan. The rest is the GitHub-owned cold-cache
          # set for the mise-pinned cosign + trivy.
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          # This job needs cosign and trivy and nothing else; a publish job
          # must not pay for (or egress for) the whole toolchain.
          install_args: cosign trivy

      # Bootstrap buildkit from Google's Docker Hub mirror: the default pull
      # from Hub's CDN dial-by-IP'd past DNS on a hosted runner and was
      # rightly refused by egress block; the mirror is a stable, named
      # endpoint (already trusted as trivy's DB source elsewhere).
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the per-architecture digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      # One tag consumers can watch (:main) plus the commit for traceability.
      # Everything that consumes this image pins the digest; the tag exists so
      # Renovate has something to resolve digest updates against.
      - name: Create and push the manifest list
        id: manifest
        run: |
          refs=()
          for f in digests/*; do
            arch_digest=$(cat "${f}")
            refs+=("${IMAGE}@${arch_digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:main" \
            --tag "${IMAGE}:sha-${GITHUB_SHA:0:7}" \
            "${refs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:main" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "published ${IMAGE}@${digest}"

      # Prove the PUBLISHED bytes, not a local twin: pull the manifest back
      # by digest (this runner resolves its amd64 leg) and boot it. The
      # signature below asserts something demonstrated of what a stranger
      # will pull.
      - name: Pull the published image back and smoke it
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          bash scripts/db-image-smoke.sh "${IMAGE}@${DIGEST}"

      # Report-only (exit-code 0): the CVE gate is ci.yml's, on pull
      # requests. This scan exists so every published digest has its
      # package-CVE state on the run log — including the weekly rebuild,
      # whose entire purpose is refreshing this layer.
      - name: Scan the published image (report-only)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          trivy image --config /dev/null --scanners vuln \
            --exit-code 0 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            "${IMAGE}@${DIGEST}"

      # Keyless: the certificate identity is this workflow's OIDC subject, so
      # the signature says "built by this workflow on this repo" and nothing
      # weaker.
      - name: Sign the manifest
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verify the way a stranger would, immediately: a signing step that
      # succeeded is not the same as a signature that verifies against the
      # identity consumers will pin.
      - name: Verify the signature as a consumer would
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp \
              '^https://github.com/CarlAllenn/monumental-archive-db/\.github/workflows/publish\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
