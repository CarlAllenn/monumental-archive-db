# REUSE.toml (spec 3.3): machine-readable licensing for every file in
# this repository. AGPL-3.0-only is this repo's own choice and stays —
# the canon permits a per-repo licence (#214) and this image is the
# archive's, not a fixture to be copied.
#
# Aggregate precedence over the whole tree, and no per-file SPDX
# headers: a header overrides the repository's declared licence and
# travels wrongly when the file is copied, which is why the org refuses
# them (scaffold/README.md, #214). The headers this repo carried in the
# Dockerfile and the smoke script were removed at the import for that
# reason; the blanket below covers them.
#
# The licence text lives in LICENSES/AGPL-3.0-only.txt, which is a
# byte-exact copy of the root LICENSE. Both are kept, and the
# duplication is the point: LICENSES/ is what REUSE tooling reads, the
# root LICENSE is what GitHub's licence detection and OpenSSF Scorecard
# read. Note also what is NOT here — no LICENSE.md pointer file. A
# pointer outranks LICENSE-<name> in every detector and contains no
# licence text, which measurably costs the Scorecard License point.
#
# Compliance is machine-checked by the belt (`lint:reuse` runs the same
# tool api.reuse.software runs, over tracked files) rather than by a
# repo-local CI job.
version = 1
SPDX-PackageName = "monumental-archive-db"
SPDX-PackageSupplier = "Carl Allen <carl.allen313@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/monumental-archive/monumental-archive-db"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Carl Allen"
SPDX-License-Identifier = "AGPL-3.0-only"
