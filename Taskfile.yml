---
# Canonical Taskfile shape (renovate-config templates/task). `task ci` is
# the whole contract — identical locally and in CI.
version: "3"

# Every command runs with bash strict mode: exit on error, unset vars are
# errors, pipeline failures propagate.
set: [errexit, nounset, pipefail]

# Parallel deps interleave output; prefix each line with its task name.
output: prefixed

tasks:
  ci:
    desc: Everything CI runs — the full gate, identical locally and on GitHub
    # Lints run as parallel deps; the ordered stages (build, smoke, image
    # scan) follow in cmds — each needs the built candidate.
    deps: [lint, scan, scan:edtf]
    cmds:
      - task: build
      - task: smoke
      - task: scan:image

  lint:
    desc: Run every linter over the whole repository
    deps:
      - lint:yaml
      - lint:toml
      - lint:md
      - lint:spell
      - lint:ec
      - lint:shell
      - lint:actions
      - lint:docker

  # --- universal enforcement layer (matches the mise universal tool set) ---
  # Every lint task is fingerprinted: sources = its file class + its own
  # config + the pinned toolchain (mise.toml/mise.lock). Unchanged inputs
  # skip the run; `task --force` overrides. The scan family is the one
  # class that must NEVER be fingerprinted.

  lint:yaml:
    desc: yamllint (strict) over all YAML
    method: checksum
    sources:
      - "**/*.yml"
      - "**/*.yaml"
      - .yamllint
      - mise.toml
      - mise.lock
    cmds:
      - yamllint --strict .

  lint:toml:
    desc: taplo format-check + lint over all TOML
    method: checksum
    sources:
      - "**/*.toml"
      - mise.toml
      - mise.lock
    cmds:
      - taplo fmt --check
      - taplo lint

  lint:md:
    desc: markdownlint-cli2 over all Markdown
    method: checksum
    sources:
      - "**/*.md"
      - .markdownlint-cli2.jsonc
      - mise.toml
      - mise.lock
    cmds:
      - markdownlint-cli2

  lint:spell:
    desc: codespell over the whole tree
    method: checksum
    sources:
      - "**/*"
      - .codespellrc
      - mise.toml
      - mise.lock
      - exclude: .task/**
      - exclude: .git/**
    cmds:
      - codespell

  lint:ec:
    desc: editorconfig-checker over the whole tree
    method: checksum
    sources:
      - "**/*"
      - .editorconfig
      - .editorconfig-checker.json
      - mise.toml
      - mise.lock
      - exclude: .task/**
      - exclude: .git/**
    cmds:
      - ec

  lint:shell:
    desc: shfmt format-check + shellcheck over all shell scripts
    method: checksum
    sources:
      - "**/*.sh"
      - .shellcheckrc
      - mise.toml
      - mise.lock
    cmds:
      - shfmt -s -i 2 -ci -bn -sr -d scripts/
      - shellcheck scripts/*.sh

  lint:actions:
    desc: actionlint + zizmor (pedantic, offline) over the workflows
    method: checksum
    sources:
      - .github/**/*.yml
      - .github/**/*.yaml
      - mise.toml
      - mise.lock
    cmds:
      - actionlint
      - zizmor --persona=pedantic --offline .github/

  lint:docker:
    desc: hadolint over the Dockerfile
    method: checksum
    sources:
      - Dockerfile
      - .hadolint.yaml
      - mise.toml
      - mise.lock
    cmds:
      - hadolint Dockerfile

  # --- scan family: never fingerprinted (canon: renovate-config
  # templates/trivy). Inputs include the trivy vulnerability database and
  # the GitHub attestation/advisory state, which change without commits. ---

  scan:
    desc: trivy full fs scan (vulns, misconfig, secrets, licenses)
    cmds:
      - trivy fs --config trivy.yaml .

  scan:edtf:
    desc: Verify the pinned edtf image digest against the publisher's attestation
    cmds:
      - bash scripts/check-edtf-attestation.sh

  scan:secrets:
    desc: gitleaks over the full git history
    # The staged-files layer is the universal pre-commit hook; this is the
    # history layer (canon: renovate-config templates/gitleaks).
    cmds:
      - gitleaks git --no-banner --redact --verbose .

  scan:image:
    desc: trivy CVE scan of the built candidate image
    # Canonical image invocation (renovate-config templates/trivy): vuln
    # scanners only — license/secret/misconfig policy governs the tree via
    # `task scan`; the image gate is package CVEs. --config /dev/null so the
    # fs-scan config cannot leak in. --ignore-unfixed: only patched-available
    # vulns fail; unfixed ones turn red when fixable.
    vars:
      IMAGE: '{{.IMAGE | default "monumental-archive-db:candidate"}}'
    cmds:
      - trivy image --config /dev/null --scanners vuln --ignore-unfixed
        --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL {{.IMAGE}}

  build:
    desc: Build the candidate image for the local architecture
    cmds:
      - docker build --tag monumental-archive-db:candidate .

  smoke:
    desc: Boot the candidate and prove every extension actually loads
    cmds:
      - bash scripts/db-image-smoke.sh monumental-archive-db:candidate
